[project]
name = "fmcg-marketing-mix-model"
version = "1.0.0"
description = "Marketing mix model for an FMCG bottled-water brand: media ROI and sales drivers"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning"]

[tool.ruff.lint.per-file-ignores]
"src/build_notebook.py" = ["E501"]  # long lines are markdown text inside templates
